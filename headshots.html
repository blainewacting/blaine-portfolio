<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headshots — Blaine Wohlgemuth</title>
<meta name="description" content="Headshot portfolio for Chicago-based actor Blaine Wohlgemuth.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:'#08090b',onyx:'#15171c',navy:'#0a1f33',deep:'#0e2c47',
          steel:'#2f5a85',mist:'#a8c4dc',line:'#1b2733',
          snow:'#f7f7f5',pearl:'#ffffff',silver:'#d8dde2',
        },
        fontFamily: {
          serif: ['Fraunces', 'Georgia', 'serif'],
          sans:  ['Inter', 'system-ui', 'sans-serif'],
          mono:  ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
        boxShadow: {
          card:    '0 1px 0 rgba(10,31,51,.06), 0 24px 48px -28px rgba(10,31,51,.35), 0 8px 18px -10px rgba(10,31,51,.18)',
          frame:   '0 0 0 1px rgba(10,31,51,.10), 0 30px 60px -30px rgba(10,31,51,.45)',
          deepcut: '0 36px 90px -42px rgba(0,0,0,.78), 0 14px 32px -18px rgba(10,31,51,.55)',
          spot:    '0 0 0 1px rgba(255,255,255,.04), 0 40px 100px -50px rgba(0,0,0,.9)',
        },
      }
    }
  }
</script>

<link rel="stylesheet" href="/styles.css">
</head>

<body class="bg-paper">

<!-- ============== HEADER ============== -->
<header class="relative z-10 pt-12 md:pt-16 pb-4 overflow-hidden">
  <div class="spotlight-stage" aria-hidden="true"></div>
  <div class="relative max-w-6xl mx-auto px-6 text-center">
    <a href="/index.html" class="inline-block group">
      <h1 class="h-name text-[3.4rem] sm:text-7xl md:text-[6.5rem] text-navy">
        Blaine<span class="amp"> </span>Wohlgemuth
      </h1>
    </a>
    <p class="mt-6 tagline">
      film<span class="dot">·</span>tv<span class="dot">·</span>theater<span class="dot">·</span>improv
    </p>
    <nav class="mt-12 flex justify-center">
      <div class="nav-rail flex-wrap">
        <a href="/index.html"     class="nav-link"><span class="num">01</span><span>Hello</span></a>
        <a href="/headshots.html" class="nav-link"><span class="num">02</span><span>Headshots</span></a>
        <a href="/resume.html"    class="nav-link"><span class="num">03</span><span>Resume</span></a>
        <a href="/media.html"     class="nav-link"><span class="num">04</span><span>Media</span></a>
        <a href="/contact.html"   class="nav-link"><span class="num">05</span><span>Contact</span></a>
      </div>
    </nav>
  </div>
</header>

<!-- ============== HEADSHOTS ============== -->
<section id="headshots" class="relative z-10 bg-deepnight text-pearl pt-8 md:pt-12 pb-28 md:pb-36 page-fade-in">
  <div class="max-w-6xl mx-auto px-6">
    <div class="text-center max-w-xl mx-auto reveal">
      <p class="eyebrow text-mist">Portfolio</p>
      <h2 class="display h-display mt-4 text-5xl md:text-6xl">Headshots</h2>
      <div class="mx-auto mt-6 rule" style="background:#7da0c4; opacity:.5;"></div>
    </div>

    <div class="mt-16 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8" data-gallery>
      <figure class="headshot-frame lift shadow-deepcut is-zoomable reveal reveal-d1" style="aspect-ratio: 4/5;" data-index="0" tabindex="0" role="button" aria-label="Open headshot 1">
        <img src="/brand_assets/headshots/headshot_1.jpg" alt="Headshot 1" loading="lazy">
      </figure>
      <figure class="headshot-frame lift shadow-deepcut is-zoomable reveal reveal-d2" style="aspect-ratio: 4/5;" data-index="1" tabindex="0" role="button" aria-label="Open headshot 2">
        <img src="/brand_assets/headshots/headshot_2.jpg" alt="Headshot 2" loading="lazy">
      </figure>
      <figure class="headshot-frame lift shadow-deepcut is-zoomable reveal reveal-d3" style="aspect-ratio: 4/5;" data-index="2" tabindex="0" role="button" aria-label="Open headshot 3">
        <img src="/brand_assets/headshots/headshot_3.jpg" alt="Headshot 3" loading="lazy">
      </figure>
      <figure class="headshot-frame lift shadow-deepcut is-zoomable reveal reveal-d4" style="aspect-ratio: 4/5;" data-index="3" tabindex="0" role="button" aria-label="Open headshot 4">
        <img src="/brand_assets/headshots/headshot_4.jpg" alt="Headshot 4" loading="lazy">
      </figure>
      <figure class="headshot-frame lift shadow-deepcut is-zoomable reveal reveal-d5" style="aspect-ratio: 4/5;" data-index="4" tabindex="0" role="button" aria-label="Open headshot 5">
        <img src="/brand_assets/headshots/headshot_5.jpg" alt="Headshot 5" loading="lazy">
      </figure>
      <figure class="headshot-frame lift shadow-deepcut is-zoomable reveal reveal-d6" style="aspect-ratio: 4/5;" data-index="5" tabindex="0" role="button" aria-label="Open headshot 6">
        <img src="/brand_assets/headshots/headshot_6.jpg" alt="Headshot 6" loading="lazy">
      </figure>
    </div>
  </div>
</section>

<!-- ============== FOOTER ============== -->
<footer class="relative z-10 bg-ink text-pearl/70 py-14">
  <div class="max-w-4xl mx-auto px-6 text-center">
    <p class="h-name text-3xl md:text-4xl text-pearl" style="font-style: italic; font-weight: 300;">Blaine Wohlgemuth</p>
    <p class="mt-3 tagline" style="color: rgba(168,196,220,.65);">
      film<span class="dot">·</span>tv<span class="dot">·</span>theater<span class="dot">·</span>improv
    </p>
    <p class="mt-7 text-[.7rem] tracking-[.24em] uppercase font-mono text-pearl/35" style="font-family: 'JetBrains Mono', ui-monospace, monospace;">© <span id="yr"></span> · all rights reserved</p>
  </div>
</footer>

<!-- ============== LIGHTBOX ============== -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Headshot viewer" aria-hidden="true">
  <button type="button" class="lightbox-btn lightbox-close" aria-label="Close">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button type="button" class="lightbox-btn lightbox-prev" aria-label="Previous">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <button type="button" class="lightbox-btn lightbox-next" aria-label="Next">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="">
  <div class="lightbox-counter" id="lightbox-counter">01 / 06</div>
</div>

<script src="/app.js"></script>
</body>
</html>
